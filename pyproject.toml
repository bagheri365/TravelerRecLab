[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "travelerreclab"
version = "0.0.1"
description = "Real-time traveler representation learning for hotel recommendations"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=17"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
training = ["torch>=2.4"]
serving = ["fastapi>=0.115", "uvicorn>=0.30", "redis>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
